<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineTrack</title>
    <meta name="description" content="CineTrack — catálogo pessoal de filmes para acompanhar o que você já viu, está vendo ou quer assistir.">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h1>CineTrack</h1>
        <input type="search" id="busca" aria-label="Buscar filme por título" placeholder="Buscar filme...">
        <!-- Dois elementos de texto: o curto aparece em telas menores,
             o longo a partir de 1024px (troca feita no @media do CSS).
             Aula 4: sem onclick — o app.js liga o botão à abrir(). -->
        <button type="button" class="btn-adicionar">
            <span class="btn-adicionar-curto" aria-label="Adicionar filme">+</span>
            <span class="btn-adicionar-longo">+ Adicionar</span>
        </button>
    </header>

    <nav aria-label="Filtros de status">
        <button type="button" class="ativo" data-status="todos">Todos</button>
        <button type="button" data-status="assistido">Assistido</button>
        <button type="button" data-status="assistindo">Assistindo</button>
        <button type="button" data-status="quero">Quero assistir</button>
    </nav>

    <main>
        <section id="lista" aria-live="polite">
            <!-- Aula 2: os cards agora nascem do array filmesIniciais (app.js),
                 renderizados por renderizarCards(). Nenhum card digitado aqui. -->
        </section>
    </main>

    <!-- Modal de adicionar/editar filme: cópia estática do
         form#form-filme de adicionar.html. Oculto pelo atributo hidden;
         o app.js o mostra via abrir()/fechar() (Aula 4). -->
    <!-- Aula 5, item 5 (acessibilidade): role="dialog" + aria-modal
         avisam o leitor de tela de que o resto da página está bloqueado;
         aria-labelledby aponta o h2 que dá nome ao diálogo. -->
    <div id="modal" class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-titulo" hidden>
        <div class="modal-conteudo">
            <button type="button" class="modal-fechar" aria-label="Fechar modal">&times;</button>
            <h2 id="modal-titulo">Adicionar filme</h2>

            <!-- Erros de validação (Aula 4, item 3): preenchido
                 pela mostrarErros(); fica oculto quando não há erros -->
            <ul id="erros" class="erros" hidden></ul>

            <form id="form-filme">
                <input type="text" name="titulo" id="titulo-filme" required>
                <label for="titulo-filme">Título</label>

                <input type="number" min="1888" max="2030" id="ano-filme" name="ano" required>
                <label for="ano-filme">Ano</label>

                <input type="text" name="genero" id="genero-filme" required>
                <label for="genero-filme">Gênero</label>

                <input type="text" name="url-poster" id="url-poster-filme">
                <label for="url-poster-filme">URL do pôster</label>

                <select name="status" id="status-filme" required>
                    <option value="quero-assistir">Quero assistir</option>
                    <option value="assistindo">Assistindo</option>
                    <option value="assistido">Assistido</option>
                </select>
                <label for="status-filme">Status</label>

                <input type="number" min="1" max="5" id="nota-filme" name="nota">
                <label for="nota-filme">Nota</label>

                <textarea name="comentario" id="comentario-filme"></textarea>
                <label for="comentario-filme">Comentário</label>

                <button type="button">Cancelar</button>
                <button type="submit">Salvar</button>
            </form>
        </div>
    </div>

    <footer>
        <a href="adicionar.html">Adicionar novo filme</a>
        <small id="total-filmes"></small>
    </footer>

    <script src="app.js"></script>
</body>

</html>
